<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liskarm UI</title>
    <link rel="stylesheet" href="styles.css" type="text/css" inline />
  </head>
  <body>
    <!--MAIN-->
    <div class="grid grid-rows-mainSplit grid-cols-1 w-screen h-screen">
      <!--NAV-->
      <div
        class="grid main-grid-area-nav border-accent-1 border-solid border-b-2"
      >
        <!-- Liskarm Logo and Text Wrapper -->
        <div class="grid grid-cols-displayColumns">
          <!-- Logo and Text Internal -->
          <div class="flex nav-grid-area-internal items-center">
            <div class="flex h-fit w-fit mr-2">
              <svg
                width="32"
                height="32"
                viewBox="0 0 128 128"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M0 64H64V128L51 77L0 64Z" fill="white" />
                <path d="M128 64H64V128L77 77L128 64Z" fill="white" />
                <path d="M0 64H64V0L51 51L0 64Z" fill="white" />
                <path d="M128 64H64V0L77 51L128 64Z" fill="white" />
              </svg>
            </div>
            <div>LISKARM UI</div>
          </div>
        </div>
        <!--Nav List Wrapper-->
        <div class="grid grid-cols-displayColumns grid-rows-1 w-screen h-full">
          <!--Nav List Container-->
          <div class="grid grid-cols-6 nav-grid-area-internal items-end">
            <div id="nav-btn-overview">Overview</div>
            <div id="nav-btn-camera">Camera</div>
            <div id="nav-btn-actionsheet">Actions</div>
            <div id="nav-btn-log">Log</div>
          </div>
        </div>
      </div>
      <div class="main-grid-area-wrapper" id="display-wrapper">
        <!-- OVERVIEW TAB -->
        <div
          class="grid grid-cols-displayColumns grid-rows-overviewRows h-full w-full"
          id="display-overview"
        >
          <!--CAMERA-->
          <div
            class="overview-grid-area-camera border-accent-1 border-solid border-2 border-t-0"
          ></div>
          <!--STATS-->
          <div
            class="overview-grid-area-stats border-accent-1 border-solid border-2 border-t-0"
          >
            <div class="grid-square-title">Stats ▾</div>
          </div>
          <!--ONGOING PROCESSES-->
          <div
            class="overview-grid-area-proc border-accent-1 border-solid border-b-2"
          >
            <div class="grid-square-title">Ongoing Processes ▾</div>
          </div>
          <!--ACTIONS-->
          <div
            class="overview-grid-area-actions border-accent-1 border-solid border-2 border-t-0"
          >
            <div class="grid-square-title">Actions ▾</div>
          </div>
        </div>
        <!-- CAMERA TAB -->
        <div
          class="grid grid-cols-displayColumns h-full w-full"
          id="display-camera"
        >
          <div class="camera-grid-area-main border-accent-1 border-x-2"></div>
          <div
            class="grid grid-cols-cameraBarColumns camera-grid-area-bar border-accent-1 border-2"
          >
            <div
              class="flex border-accent-1 border-r-2 flex-shrink"
              id="camera-bar-stats"
            >
              <div class="grid-square-title">Stats ▾</div>
            </div>
            <div
              class="flex border-accent-1 border-r-2 flex-wrap"
              id="camera-bar-auxiliary"
            >
              <div class="grid-square-title">View ▾</div>
            </div>
            <div class="flex border-accent-1" id="camera-bar-controls">
              <div class="grid-square-title">Robot ▾</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js" inline></script>
  </body>
</html>
